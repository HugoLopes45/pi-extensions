name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PI_PACKAGES: >-
    @earendil-works/chord
    @earendil-works/pi-agent-core
    @earendil-works/pi-ai
    @earendil-works/pi-codemode
    @earendil-works/pi-coding-agent
    @earendil-works/pi-mcp
    @earendil-works/pi-telemetry
    @earendil-works/pi-tui

concurrency:
  group: ci-${{ github.ref }}
  # A run on main can publish, so only pull request runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pi requires Node 22.19 or later.
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # Corepack installs the pnpm version pinned in packageManager and verifies its signature.
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare pinned DAP integration fixture
        run: node packages/pi-hl-dap/scripts/fetch-vscode-js-debug.mjs
      - run: pnpm run verify

  # Each package declares its oldest supported Pi in engines.pi. It is checked on that version and on the latest.
  pi-versions:
    name: Pi versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: versions
        run: |
          versions=$(jq --slurp --compact-output '[.[] | if (.engines.pi // "") | test("^>=[0-9]+\\.[0-9]+\\.[0-9]+$") then .engines.pi | ltrimstr(">=") else error("\(.name) needs engines.pi set to \">=X.Y.Z\"") end] + ["latest"] | unique' packages/*/package.json)
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  pi-compat:
    name: Pi ${{ matrix.pi }}
    needs: pi-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi: ${{ fromJSON(needs.pi-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable pnpm
      # Pi's packages depend on each other with caret ranges, so each one is pinned to match a real install.
      - name: Pin Pi ${{ matrix.pi }}
        run: |
          echo "overrides:" >> pnpm-workspace.yaml
          for package in $PI_PACKAGES; do
            version=$(npm view "$package@$PI_VERSION" version)
            echo "  \"$package\": \"$version\"" >> pnpm-workspace.yaml
          done
          pnpm install --no-frozen-lockfile --ignore-scripts
        env:
          PI_VERSION: ${{ matrix.pi }}
      - name: Prepare pinned DAP integration fixture
        run: node packages/pi-hl-dap/scripts/fetch-vscode-js-debug.mjs
      - if: matrix.pi != 'latest'
        name: Check the packages whose oldest supported Pi is ${{ matrix.pi }}
        run: |
          filters=$(jq --raw-output --arg pi ">=$PI_VERSION" 'select(.engines.pi == $pi) | "--filter=\(.name)"' packages/*/package.json)
          pnpm $filters run check
        env:
          PI_VERSION: ${{ matrix.pi }}
      - if: matrix.pi == 'latest'
        run: pnpm run verify

  # The matrix changes with engines.pi, so the main ruleset requires this job instead of each version.
  pi-compat-result:
    name: Pi compatibility
    needs: pi-compat
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.pi-compat.result != 'success'
        run: exit 1

  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run zizmor==1.32.0 --format=github .github
        env:
          GH_TOKEN: ${{ github.token }}

  # Opens or updates the "Version Packages" pull request from the changesets on main.
  version:
    name: Version packages
    needs: [check, pi-compat, workflow-security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the changeset-release/main branch
      pull-requests: write # open the Version Packages pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Pull requests opened with the default token do not trigger the required checks.
          github-token: ${{ secrets.RELEASE_PR_TOKEN }}
          version-script: pnpm run version-packages

  # A package is released when its package.json version is not on npm or has no tag yet.
  plan:
    name: Plan releases
    needs: [check, pi-compat, workflow-security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: |
          packages='[]'
          for manifest in packages/*/package.json; do
            # A private package is shared code bundled into the extensions, never published.
            if [ "$(jq -r '.private // false' "$manifest")" = true ]; then continue; fi
            package=$(jq -r .name "$manifest")
            version=$(jq -r .version "$manifest")
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/$package/$version")
            if [ "$status" != 200 ] && [ "$status" != 404 ]; then
              echo "npm registry returned HTTP $status for $package@$version." >&2
              exit 1
            fi
            # Exit code 2 means the tag does not exist, for example after a first publication by hand.
            tag_status=0
            git ls-remote --exit-code --tags origin "refs/tags/$package@v$version" > /dev/null || tag_status=$?
            if [ "$tag_status" != 0 ] && [ "$tag_status" != 2 ]; then
              echo "git ls-remote failed with exit code $tag_status." >&2
              exit 1
            fi
            if [ "$status" = 404 ] || [ "$tag_status" = 2 ]; then
              packages=$(jq --compact-output --arg package "$package" '. + [$package]' <<< "$packages")
            fi
          done
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  release:
    name: Release ${{ matrix.package }}
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    runs-on: ubuntu-latest
    environment: npm
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    concurrency:
      group: release-${{ matrix.package }}
      cancel-in-progress: false
    permissions:
      contents: write # create the tag and the GitHub release
      id-token: write # npm trusted publishing and provenance
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      # Pi shows CHANGELOG.md to users after an update; the entry is also the release notes.
      - name: Read the changelog entry
        run: |
          awk -v version="$VERSION" '$1 == "##" && $2 == version { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "CHANGELOG.md needs a non-empty '## $VERSION' entry." >&2
            exit 1
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # npm install rejects pnpm's workspace: protocol; the exact version is satisfied by the bundled copy.
      - name: Pin workspace dependencies
        run: |
          for dep in $(jq -r '.dependencies // {} | to_entries[] | select(.value | startswith("workspace:")) | .key' package.json); do
            version=$(jq -er .version "../$dep/package.json")
            npm pkg set "dependencies.$dep=$version"
          done
      # Skipped when the version is already on npm, so a failed release step can be re-run.
      - name: Publish to npm
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/$PACKAGE/$VERSION")
          case "$status" in
            200) echo "$PACKAGE@$VERSION is already on npm." ;;
            404) npm publish ;;
            *)
              echo "npm registry returned HTTP $status for $PACKAGE@$VERSION." >&2
              exit 1
              ;;
          esac
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ steps.version.outputs.version }}
      - name: Create the GitHub release
        run: gh release create "$PACKAGE@v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$PACKAGE@v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ steps.version.outputs.version }}
