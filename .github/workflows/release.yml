name: Publish release
run-name: Publish ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      actions: read # read CI runs of the release commit
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # A tag names one package: <package>@vX.Y.Z, for example pi-context-kit@v0.4.3.
      - name: Read the release tag
        id: tag
        run: |
          if [[ ! "$TAG" =~ ^([a-z0-9-]+)@v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            echo "Release tag must be <package>@vX.Y.Z, got $TAG." >&2
            exit 1
          fi
          package="${BASH_REMATCH[1]}"
          if [ ! -f "packages/$package/package.json" ] || [ "$(jq -r .name "packages/$package/package.json")" != "$package" ]; then
            echo "No workspace package named $package." >&2
            exit 1
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.release.tag_name }}
      - name: Require a tested main commit
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          conclusion=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main" | jq --slurp --raw-output '[.[].workflow_runs[]] | max_by(.run_number) | .conclusion')
          if [ "$conclusion" != "success" ]; then
            echo "The latest CI run for $GITHUB_SHA on main must succeed before publication." >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      # Pi shows CHANGELOG.md to users after an update.
      - name: Require a changelog entry
        working-directory: packages/${{ steps.tag.outputs.package }}
        run: |
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "CHANGELOG.md needs a '## [${VERSION}]' entry." >&2
            exit 1
          fi
        env:
          VERSION: ${{ steps.tag.outputs.version }}
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Publish to npm
        working-directory: packages/${{ steps.tag.outputs.package }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish
        env:
          VERSION: ${{ steps.tag.outputs.version }}
